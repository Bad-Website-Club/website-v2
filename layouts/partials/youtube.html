<div class="video-container">
  <iframe
    src="
    https://www.youtube.com/embed/{{ .id }}
    "
    allowfullscreen
    allow="
      accelerometer;
      autoplay;
      clipboard-write;
      encrypted-media;
      gyroscope;
      picture-in-picture;
    "
    loading="lazy"
    title="YouTube video player"
  ></iframe>
</div>
